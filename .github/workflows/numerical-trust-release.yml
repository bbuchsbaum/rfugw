name: Numerical trust (Release)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-artifact:
    name: canonical-source-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
          needs: check
      - name: Build one canonical source artifact and manifest
        run: |
          R CMD build . --md5
          Rscript tools/numerical-trust/release-artifact.R --mode=manifest --commit=${{ github.sha }}
      - name: Upload canonical source artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfugw-source-${{ github.sha }}
          if-no-files-found: error
          path: |
            rfugw_*.tar.gz
            release-artifact.json

  release-matrix:
    name: release-${{ matrix.os }}
    needs: build-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RFUGW_TRUST_SCOPE: release
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::digest
            any::jsonlite
            any::lpSolve
            any::Matrix
            any::testthat
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: rfugw-source-${{ github.sha }}
          path: "."
      - name: Verify, check, and install the canonical source artifact
        shell: Rscript {0}
        run: |
          status <- system2("Rscript", c("tools/numerical-trust/release-artifact.R", "--mode=verify", "--commit=${{ github.sha }}"))
          stopifnot(status == 0L)
          tarball <- list.files(pattern = "^rfugw_[^/]+\\.tar\\.gz$", full.names = TRUE)
          stopifnot(length(tarball) == 1L)
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "check", "--as-cran", "--no-manual", tarball))
          stopifnot(status == 0L)
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "INSTALL", tarball))
          stopifnot(status == 0L)
      - name: Complete installed-package oracle matrix
        run: Rscript tools/numerical-trust/run-laws.R --family=all --scope=release --installed
      - name: Moment-FUGW installed core numerical certification
        run: >-
          Rscript inst/bench/run_moment_fugw_core_certification.R
          release .gate/moment-fugw-core installed
      - name: Moment-FUGW installed metamorphic and adversarial replay
        run: >-
          Rscript inst/bench/run_moment_fugw_robustness.R
          release .gate/moment-fugw-robustness installed
      - name: Moment-FUGW full installed performance and native-RSS certificate
        if: runner.os != 'Windows'
        run: >-
          Rscript inst/bench/run_moment_fugw_benchmark.R
          full .gate/moment-fugw-performance installed
      - name: Moment-FUGW frozen installed scientific evaluation
        run: >-
          Rscript inst/bench/run_moment_fugw_scientific_validation.R
          evaluation .gate/moment-fugw-scientific installed
      - name: Mutation proof and artifact ledger
        run: |
          Rscript tools/numerical-trust/run-mutation-proof.R .gate/numerical-trust
          Rscript tools/numerical-trust/collect-evidence.R --output=.gate/numerical-trust --scope=release --channel=hosted --installed
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-trust-release-${{ matrix.os }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .gate/numerical-trust
            .gate/moment-fugw-core
            .gate/moment-fugw-robustness
            .gate/moment-fugw-performance
            .gate/moment-fugw-scientific
            rfugw_*.tar.gz
            release-artifact.json
            rfugw.Rcheck/00check.log

  release-sanitizers:
    needs: build-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RFUGW_TRUST_SCOPE: release
      RFUGW_OPENMP_FLAGS: ""
      RFUGW_OPENMP_LIBS: ""
      RFUGW_EXTRA_CXXFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
      RFUGW_EXTRA_LIBS: "-fsanitize=address,undefined"
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::digest
            any::jsonlite
            any::lpSolve
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: rfugw-source-${{ github.sha }}
          path: "."
      - name: Preload the ASan runtime into the R host process
        run: echo "LD_PRELOAD=$(gcc -print-file-name=libasan.so)" >> "$GITHUB_ENV"
      - name: Verify and install canonical artifact under ASan/UBSan
        run: |
          Rscript tools/numerical-trust/release-artifact.R --mode=verify --commit=${{ github.sha }}
          R CMD INSTALL rfugw_*.tar.gz
          Rscript tools/smoke-flagship.R
          Rscript tools/numerical-trust/run-mutation-proof.R .gate/numerical-trust
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-trust-release-sanitizers
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .gate/numerical-trust
            release-artifact.json

  moment-fugw-admission:
    name: moment-fugw-cross-platform-candidate-receipt
    needs: [build-artifact, release-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: rfugw-source-${{ github.sha }}
          path: .gate/moment-fugw-admission/source
      - uses: actions/download-artifact@v4
        with:
          pattern: numerical-trust-release-*
          merge-multiple: false
          path: .gate/moment-fugw-admission/evidence
      - name: Recompute cross-platform Moment-FUGW candidate admission
        run: >-
          Rscript tools/numerical-trust/verify-moment-fugw-admission.R
          --mode=candidate
          --manifest=.gate/moment-fugw-admission/source/release-artifact.json
          --evidence-root=.gate/moment-fugw-admission/evidence
          --commit=${{ github.sha }}
          --output=.gate/moment-fugw-admission/candidate-receipt.json
      - name: Upload Moment-FUGW candidate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moment-fugw-admission-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: .gate/moment-fugw-admission/candidate-receipt.json

  pot-oracle-release:
    name: installed-artifact-live-pot-oracle
    needs: build-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::digest
            any::jsonlite
            any::lpSolve
            any::Matrix
            any::testthat
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: rfugw-source-${{ github.sha }}
          path: "."
      - name: Verify and install the canonical source artifact
        run: |
          Rscript tools/numerical-trust/release-artifact.R --mode=verify --commit=${{ github.sha }}
          R CMD INSTALL rfugw_*.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pot-oracle/requirements-baseline.txt
      - name: Install the pinned POT oracle
        run: python -m pip install --requirement tools/pot-oracle/requirements-baseline.txt
      - name: Generate release-profile POT evidence
        run: >-
          python tools/pot-oracle/generate.py
          --profile=release
          --channel=baseline
          --output=.gate/pot-oracle/pot-release.json
      - name: Certify the installed canonical artifact
        run: >-
          Rscript tools/pot-oracle/compare.R
          --input=.gate/pot-oracle/pot-release.json
          --output=.gate/pot-oracle/rfugw-release.json
          --scope=release
      - name: Upload release POT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pot-oracle-release-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .gate/pot-oracle
            release-artifact.json
