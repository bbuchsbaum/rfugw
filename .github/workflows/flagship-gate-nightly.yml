name: Flagship protocol gate (Nightly)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  flagship-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RFUGW_PROTOCOL_SCALE: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::jsonlite
            any::testthat
            any::lpSolve
          needs: check
      - name: Nightly protocol gate
        run: |
          chmod +x inst/bench/run_flagship_gate.sh
          inst/bench/run_flagship_gate.sh \
            inst/bench/results/current \
            fgw,fugw,semirelaxed,partial,ucoot,sampled \
            nightly \
            2 \
            20260816 \
            1
      - name: Thread equivalence smoke
        run: Rscript inst/bench/gate_threads.R inst/bench/results/current/threads.csv 20260816
      - name: Upload protocol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-gate-nightly
          if-no-files-found: warn
          path: |
            inst/bench/results/current/meta.json
            inst/bench/results/current/runs.csv
            inst/bench/results/current/quality.csv
            inst/bench/results/current/gate_report.md
            inst/bench/results/current/threads.csv
