name: Live POT differential oracle

on:
  pull_request:
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "tools/pot-oracle/**"
      - "inst/pot-oracle-contract.md"
      - "DESCRIPTION"
      - ".github/workflows/pot-oracle.yml"
  push:
    branches: [main]
    paths:
      - "R/**"
      - "src/**"
      - "tests/**"
      - "tools/pot-oracle/**"
      - "inst/pot-oracle-contract.md"
      - "DESCRIPTION"
      - ".github/workflows/pot-oracle.yml"
  schedule:
    - cron: "45 6 * * *"
  workflow_dispatch:

jobs:
  baseline:
    name: pinned-baseline-${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      POT_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::jsonlite
            any::lpSolve
            any::Matrix
            any::testthat
          needs: check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pot-oracle/requirements-baseline.txt
      - name: Install the pinned POT oracle
        run: python -m pip install --requirement tools/pot-oracle/requirements-baseline.txt
      - name: Generate versioned POT evidence
        run: >-
          python tools/pot-oracle/generate.py
          --profile=${POT_PROFILE}
          --channel=baseline
          --output=.gate/pot-oracle/pot-baseline.json
      - name: Compare the installed rfugw package
        run: >-
          Rscript tools/pot-oracle/compare.R
          --input=.gate/pot-oracle/pot-baseline.json
          --output=.gate/pot-oracle/rfugw-baseline.json
          --scope=${POT_PROFILE}
      - name: Upload baseline differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pot-oracle-baseline-${{ github.sha }}
          if-no-files-found: error
          path: .gate/pot-oracle

  latest-compatibility:
    name: bounded-latest-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::jsonlite
            any::lpSolve
            any::Matrix
            any::testthat
          needs: check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pot-oracle/requirements-latest.txt
      - name: Install the bounded latest POT stack
        run: python -m pip install --upgrade --requirement tools/pot-oracle/requirements-latest.txt
      - name: Generate latest-channel POT evidence
        run: >-
          python tools/pot-oracle/generate.py
          --profile=nightly
          --channel=latest
          --output=.gate/pot-oracle/pot-latest.json
      - name: Compare the installed rfugw package
        run: >-
          Rscript tools/pot-oracle/compare.R
          --input=.gate/pot-oracle/pot-latest.json
          --output=.gate/pot-oracle/rfugw-latest.json
          --scope=nightly-latest
      - name: Upload latest-channel differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pot-oracle-latest-${{ github.sha }}
          if-no-files-found: warn
          path: .gate/pot-oracle
