name: linear-ot

on:
  push:
    paths:
      - "R/linear_ot.R"
      - "R/ot_utils.R"
      - "R/solver_helpers.R"
      - "src/**"
      - "tests/testthat/test-linear-ot*.R"
      - "inst/extdata/fixtures/linear_ot_fixture.json"
      - "tools/generate_pot_linear_ot.py"
      - ".github/workflows/linear-ot.yml"
  pull_request:
    paths:
      - "R/linear_ot.R"
      - "R/ot_utils.R"
      - "R/solver_helpers.R"
      - "src/**"
      - "tests/testthat/test-linear-ot*.R"
      - "inst/extdata/fixtures/linear_ot_fixture.json"
      - "tools/generate_pot_linear_ot.py"
      - ".github/workflows/linear-ot.yml"

jobs:
  linear-ot:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::jsonlite
          needs: check
      - name: Install package
        run: R CMD INSTALL .
      - name: Linear-OT certification tests
        run: |
          Rscript -e 'library(rfugw); testthat::test_dir("tests/testthat", filter = "linear-ot", stop_on_failure = TRUE)'
