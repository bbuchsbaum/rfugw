name: Flagship protocol gate (PR)

on:
  push:
    branches: [main, master]
    paths:
      - "R/**"
      - "src/**"
      - "inst/bench/**"
      - "DESCRIPTION"
      - ".github/workflows/flagship-gate.yml"
  pull_request:
    paths:
      - "R/**"
      - "src/**"
      - "inst/bench/**"
      - "DESCRIPTION"
      - ".github/workflows/flagship-gate.yml"
  workflow_dispatch:

jobs:
  flagship-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RFUGW_PROTOCOL_SCALE: pr
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
            any::jsonlite
            any::testthat
          needs: check
      - name: Flagship PR protocol gate
        run: |
          chmod +x inst/bench/run_flagship_gate.sh
          inst/bench/run_flagship_gate.sh \
            inst/bench/results/current \
            fgw,fugw,semirelaxed \
            pr \
            1 \
            20260816 \
            1
      - name: Upload protocol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-gate-pr
          if-no-files-found: warn
          path: |
            inst/bench/results/current/meta.json
            inst/bench/results/current/runs.csv
            inst/bench/results/current/quality.csv
            inst/bench/results/current/gate_report.md
