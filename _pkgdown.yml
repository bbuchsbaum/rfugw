url: https://bbuchsbaum.github.io/rfugw/

template:
  bootstrap: 5

home:
  title: rfugw
  description: Focused high-performance optimal transport in R.

reference:
  - title: Linear optimal transport
    desc: Public balanced, exact, and KL-unbalanced linear-OT primitives.
    contents:
      - ot_sinkhorn
      - ot_emd
      - ot_sinkhorn_unbalanced
