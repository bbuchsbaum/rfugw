      - rfugw_value
      - rfugw_status
      - rfugw_residuals
  - title: Flagship GW and FGW
    desc: Primary unregularized and entropic solvers. Unregularized names are conditional-gradient procedures, not global optimizers.
    contents:
      - fgw_entropic
      - fgw_entropic2
      - fgw_exact_cg
      - fugw_kl
      - fugw_kl2
      - gromov_wasserstein
